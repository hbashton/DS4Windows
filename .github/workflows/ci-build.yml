name: CI Build

# Autobuild that runs on every push and pull request, plus manual triggers.
# Complements release.yml (which only runs when a GitHub Release is published).
# Produces runnable x64 and x86 packages as downloadable build artifacts.

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]   # tag pushes are handled by release.yml
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests (x64)
        run: dotnet test .\DS4WindowsTests\DS4WindowsTests.csproj -c Release -p:Platform=x64 --verbosity normal

  build:
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, x86 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore dependencies
        run: dotnet restore

      - name: Compute version
        id: ver
        shell: bash
        run: |
          VERSION="$(date +%Y.%m.%d)-ci-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.platform }}
        run: dotnet publish .\DS4Windows\DS4WinWPF.csproj -c Release /p:platform=${{ matrix.platform }} -o .\bin\${{ matrix.platform }}\Release\output

      - name: Package ${{ matrix.platform }}
        run: python .\utils\post-build.py .\bin\${{ matrix.platform }}\Release\output . ${{ env.VERSION }}

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS4Windows-${{ matrix.platform }}
          path: .\bin\${{ matrix.platform }}\Release\DS4Windows_${{ env.VERSION }}_${{ matrix.platform }}.zip
          if-no-files-found: error
