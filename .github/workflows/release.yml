name: .NET Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    #this makes it not run if tests failed.
    #needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
           ref: ${{ github.event.release.tag_name }}
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: "8.0.419"
    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10.18"
    - name: Restore dependencies
      run: dotnet restore
    - name: Test immutable VIIPER native bundle contract
      run: python .\utils\test_viiper_native_bundle.py
    - name: Verify and export native VIIPER build pins
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $bundle = ".\extras\viiper-native-udecx"
        $lockPath = ".\extras\viiper-native-udecx.lock.json"
        $contract = ".\DS4Windows\DS4Control\Viiper\ViiperNativePackageContract.cs"
        .\utils\validate-viiper-native-bundle-signatures.ps1 `
          -BundleRoot $bundle -LockPath $lockPath -ContractPath $contract
        if ($LASTEXITCODE -ne 0) {
          throw "The production VIIPER native bundle is not trusted."
        }
        $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
        $files = @{}
        foreach ($entry in @($lock.files)) {
          if ($files.ContainsKey([string]$entry.path)) {
            throw "The native bundle lock contains duplicate file paths."
          }
          $files[[string]$entry.path] = [string]$entry.sha256
        }
        $pins = [ordered]@{
          VIIPER_NATIVE_SOURCE_REVISION = [string]$lock.provenance.sourceRevision
          VIIPER_NATIVE_DRIVER_PACKAGE_VERSION = [string]$lock.driverPackageVersion
          VIIPER_NATIVE_DRIVER_BUILD_IDENTITY = [string]$lock.driverBuildIdentity
          VIIPER_NATIVE_BROKER_SHA256 = $files['viiper.exe']
          VIIPER_NATIVE_HELPER_SHA256 = $files['ViiperUdeCtl.exe']
          VIIPER_NATIVE_MANIFEST_SHA256 = $files['submission-manifest.json']
          VIIPER_NATIVE_INF_SHA256 = $files['driver/ViiperUde.inf']
          VIIPER_NATIVE_SYS_SHA256 = $files['driver/ViiperUde.sys']
          VIIPER_NATIVE_CAT_SHA256 = $files['driver/ViiperUde.cat']
          VIIPER_NATIVE_LOCK_SHA256 = (Get-FileHash -LiteralPath $lockPath `
            -Algorithm SHA256).Hash.ToLowerInvariant()
        }
        if ($pins.VIIPER_NATIVE_SOURCE_REVISION -notmatch `
            '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') {
          throw "The native source revision is not canonical."
        }
        if ($pins.VIIPER_NATIVE_DRIVER_PACKAGE_VERSION -notmatch `
            '^\d+\.\d+\.\d+\.\d+$') {
          throw "The native driver package version is not canonical."
        }
        foreach ($key in @(
            'VIIPER_NATIVE_DRIVER_BUILD_IDENTITY',
            'VIIPER_NATIVE_BROKER_SHA256',
            'VIIPER_NATIVE_HELPER_SHA256',
            'VIIPER_NATIVE_MANIFEST_SHA256',
            'VIIPER_NATIVE_INF_SHA256',
            'VIIPER_NATIVE_SYS_SHA256',
            'VIIPER_NATIVE_CAT_SHA256',
            'VIIPER_NATIVE_LOCK_SHA256')) {
          if ($pins[$key] -notmatch '^[0-9a-f]{64}$') {
            throw "Native build pin '$key' is not canonical."
          }
        }
        foreach ($pin in $pins.GetEnumerator()) {
          "$($pin.Key)=$($pin.Value)" >> $env:GITHUB_ENV
        }
    - name: Set envars for versions
      run: | 
        TAG=${{ github.event.release.tag_name }}
        VERSION=${TAG#v}
        PROJECT_ASSEMBLY_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('DS4Windows/DS4WinWPF.csproj').find('.//AssemblyVersion').text)")
        PROJECT_VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('DS4Windows/DS4WinWPF.csproj').find('.//Version').text)")
        if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-.*)?$ ]]; then
          BINARY_VERSION=${VERSION%%-*}
          PACKAGE_VERSION=$VERSION
        else
          BINARY_VERSION=$PROJECT_ASSEMBLY_VERSION
          PACKAGE_VERSION=$PROJECT_VERSION
        fi
        echo "Release: $VERSION; binary: $BINARY_VERSION; package: $PACKAGE_VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "BINARY_VERSION=$BINARY_VERSION" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
      shell: bash
    - name: Build X64
      run: dotnet publish .\DS4Windows\DS4WinWPF.csproj -c Release /p:platform=x64 -r win-x64 --self-contained true /p:AssemblyVersion=${{ env.BINARY_VERSION }} /p:FileVersion=${{ env.BINARY_VERSION }} /p:Version=${{ env.PACKAGE_VERSION }} /p:InformationalVersion=${{ env.VERSION }} /p:ViiperNativeBundleEnabled=true /p:ViiperNativeSourceRevision=${{ env.VIIPER_NATIVE_SOURCE_REVISION }} /p:ViiperNativeDriverPackageVersion=${{ env.VIIPER_NATIVE_DRIVER_PACKAGE_VERSION }} /p:ViiperNativeDriverBuildIdentity=${{ env.VIIPER_NATIVE_DRIVER_BUILD_IDENTITY }} /p:ViiperNativeBrokerSha256=${{ env.VIIPER_NATIVE_BROKER_SHA256 }} /p:ViiperNativeHelperSha256=${{ env.VIIPER_NATIVE_HELPER_SHA256 }} /p:ViiperNativeManifestSha256=${{ env.VIIPER_NATIVE_MANIFEST_SHA256 }} /p:ViiperNativeInfSha256=${{ env.VIIPER_NATIVE_INF_SHA256 }} /p:ViiperNativeSysSha256=${{ env.VIIPER_NATIVE_SYS_SHA256 }} /p:ViiperNativeCatSha256=${{ env.VIIPER_NATIVE_CAT_SHA256 }} /p:ViiperNativeLockSha256=${{ env.VIIPER_NATIVE_LOCK_SHA256 }} -o .\bin\x64\Release\output
    - name: Sign and verify release binaries
      shell: pwsh
      env:
        DS4W_SIGN_CERT_BASE64: ${{ secrets.DS4W_SIGN_CERT_BASE64 }}
        DS4W_SIGN_CERT_PASSWORD: ${{ secrets.DS4W_SIGN_CERT_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:DS4W_SIGN_CERT_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:DS4W_SIGN_CERT_PASSWORD)) {
          throw (
            "DS4Windows release signing credentials are required for the " +
            "native driver installation chain.")
        }
        $certificatePath = Join-Path $env:RUNNER_TEMP "ds4windows-release.pfx"
        [IO.File]::WriteAllBytes($certificatePath,
          [Convert]::FromBase64String($env:DS4W_SIGN_CERT_BASE64))
        $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
        # VIIPER is an immutable release input whose exact hash is compiled
        # into DS4Windows. Mutating it here would invalidate that identity.
        $firstPartyBinaries = @(".\bin\x64\Release\output\DS4Windows.exe")
        foreach ($path in $firstPartyBinaries) {
          & $signtool sign /fd SHA256 /f $certificatePath `
            /p $env:DS4W_SIGN_CERT_PASSWORD /tr https://timestamp.digicert.com `
            /td SHA256 $path
          if ($LASTEXITCODE -ne 0) {
            throw "First-party release signing failed for $path."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne "Valid") {
            throw "Required release signature is invalid for ${path}: $($signature.StatusMessage)"
          }
        }
        "DS4W_SIGN_CERT_PATH=$certificatePath" >> $env:GITHUB_ENV
        "DS4W_SIGNING_ENABLED=true" >> $env:GITHUB_ENV
    - name: Post-Build script X64
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python .\utils\post-build.py .\bin\x64\Release\output . ${{env.VERSION}} --require-native-bundle
    - name: Build standard installer X64
      shell: pwsh
      env:
        DS4W_SIGN_CERT_PASSWORD: ${{ secrets.DS4W_SIGN_CERT_PASSWORD }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $parameters = @{
          PublishRoot = ".\bin\x64\Release\DS4Windows"
          ProductVersion = "${{ env.BINARY_VERSION }}"
          BundleVersion = "${{ env.BINARY_VERSION }}"
          DisplayVersion = "${{ env.VERSION }}"
          OutputDirectory = ".\bin\x64\Release\installer"
          SkipApplicationPublish = $true
          RequireNativeBundle = $true
        }
        $parameters.RequireSigning = $true
        .\installer\build-installer.ps1 @parameters
    - name: Name release asset
      shell: pwsh
      run: |
        $source = ".\bin\x64\Release\DS4Windows_${{ env.VERSION }}_x64.zip"
        $asset = if ("${{ env.VERSION }}" -like "VIIPER*") {
          ".\bin\x64\Release\DS4Windows_VIIPER_x64.zip"
        } else {
          $source
        }
        if ($asset -ne $source) {
          Move-Item -LiteralPath $source -Destination $asset -Force
        }
        $installerSource = ".\bin\x64\Release\installer\DS4Windows_${{ env.VERSION }}_Setup_x64.exe"
        $installerAsset = ".\bin\x64\Release\installer\DS4Windows_${{ env.BINARY_VERSION }}_Setup_x64.exe"
        if ($installerAsset -ne $installerSource) {
          Move-Item -LiteralPath $installerSource -Destination $installerAsset -Force
        }
        "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
        "INSTALLER_ASSET=$installerAsset" >> $env:GITHUB_ENV
    - name: Publish release Build X64
      run: gh release upload ${{github.event.release.tag_name}} ${{ env.RELEASE_ASSET }} ${{ env.INSTALLER_ASSET }} --clobber
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
